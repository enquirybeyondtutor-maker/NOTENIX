name: Keep backend warm

# Pings the backend (and, via /ping, the database) so Render + Neon don't
# spin down on idle — which is what caused the intermittent slow first-load.
# Free: runs on GitHub-hosted runners (unlimited minutes on public repos).

on:
  schedule:
    - cron: "*/10 * * * *"   # every 10 minutes (GitHub may delay under load)
  workflow_dispatch:            # allow a manual run from the Actions tab

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping /ping (wakes web service + database)
        run: |
          curl -fsS --max-time 60 https://notenix.onrender.com/ping || echo "ping failed (backend may be cold-starting)"

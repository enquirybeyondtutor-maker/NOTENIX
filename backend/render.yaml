services:
  - type: web
    name: notenix-api-v2
    runtime: docker
    dockerfilePath: ./Dockerfile
    plan: free
    healthCheckPath: /health
    envVars:
      - key: DATABASE_URL
        sync: false
      - key: SECRET_KEY
        sync: false
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: CLAUDE_MODEL
        value: claude-sonnet-4-6
      - key: FRONTEND_URL
        value: https://www.notenix.com
      - key: PAYMENT_ACCOUNTS
        sync: false
      - key: PRO_PRICE
        value: "9.99"
      - key: REQUEST_PRICE
        value: "0"
      - key: FREE_QUIZ_LIMIT
        value: "3"
